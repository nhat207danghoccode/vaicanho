<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Open World RPG — 6 Map · Weapon · NPC</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#050a16;font-family:system-ui,-apple-system,sans-serif;color:#f5f3ff;overscroll-behavior:none}
#game{position:fixed;inset:0}canvas{display:block;outline:0}
.hud-top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:6px;padding:calc(10px + env(safe-area-inset-top)) 10px 10px;background:linear-gradient(180deg,rgba(5,10,22,.95),rgba(5,10,22,.6) 70%,transparent);pointer-events:none}
.hud-top>*{pointer-events:auto}
.hud-btn{width:38px;height:38px;border-radius:11px;border:1px solid rgba(139,92,246,.35);background:rgba(20,15,40,.85);color:#c4b5fd;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(12px);flex-shrink:0}
.hud-btn:active{transform:scale(.92)}
.hud-btn.active{border-color:#fbbf24;color:#fbbf24;box-shadow:0 0 16px rgba(251,191,36,.5)}
.hud-title{flex:1;min-width:0;text-align:center;font-weight:800;font-size:10px;letter-spacing:1.2px;color:#9df3ff;text-shadow:0 0 12px rgba(56,189,248,.5);overflow:hidden}
.hud-title small{display:block;font-weight:600;font-size:8px;color:#8899aa;margin-top:1px}
.placeholder-row{position:fixed;top:calc(60px + env(safe-area-inset-top));right:10px;z-index:19;display:flex;flex-direction:column;gap:6px}
.placeholder-btn{width:40px;height:40px;border-radius:11px;border:1.5px dashed rgba(139,92,246,.3);background:rgba(15,11,26,.5);color:rgba(139,92,246,.45);font-size:13px;display:flex;align-items:center;justify-content:center;cursor:not-allowed}
.weapon-dock{position:fixed;left:10px;bottom:calc(120px + env(safe-area-inset-bottom));z-index:20;display:flex;flex-direction:column;gap:6px;max-height:55dvh;overflow-y:auto;padding:6px;scrollbar-width:thin;scrollbar-color:rgba(139,92,246,.4) transparent}
.weapon-dock::-webkit-scrollbar{width:3px}.weapon-dock::-webkit-scrollbar-thumb{background:rgba(139,92,246,.4);border-radius:3px}
.weapon-item{width:52px;height:52px;border-radius:12px;border:1.5px solid rgba(139,92,246,.25);background:rgba(15,11,30,.9);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:.18s;flex-shrink:0;position:relative}
.weapon-item.active{border-color:var(--c,#7c3aed);box-shadow:0 0 16px var(--c,#7c3aed)}
.weapon-item span.em{font-size:18px}
.weapon-item span.lb{font-weight:800;font-size:7px;color:#c4b5fd;max-width:46px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.weapon-item.active span.lb{color:#fff}
.controls-bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-between;align-items:flex-end;padding:0 18px calc(18px + env(safe-area-inset-bottom));pointer-events:none}
.joystick{position:relative;width:128px;height:128px;border-radius:50%;background:radial-gradient(circle,rgba(30,24,48,.75),rgba(10,6,24,.55));border:1.5px solid rgba(139,92,246,.4);box-shadow:inset 0 0 24px rgba(80,180,255,.08),0 10px 30px rgba(0,0,0,.5);pointer-events:auto;touch-action:none;user-select:none}
.joystick-ring{position:absolute;inset:16px;border:1px dashed rgba(139,92,246,.35);border-radius:50%}
.joystick-knob{position:absolute;left:50%;top:50%;width:52px;height:52px;transform:translate(-50%,-50%);border-radius:50%;background:linear-gradient(145deg,#a78bfa,#7c3aed);border:2px solid #e9ddff;box-shadow:0 0 20px rgba(124,58,237,.6);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;pointer-events:none}
.actions{display:flex;gap:10px;pointer-events:auto}
.action-btn{width:62px;height:66px;border-radius:18px;border:1px solid rgba(139,92,246,.4);background:linear-gradient(145deg,rgba(30,24,48,.95),rgba(15,11,26,.95));color:#c4b5fd;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;transition:.15s;touch-action:manipulation}
.action-btn:active{transform:scale(.93)}
.action-btn.active{background:linear-gradient(145deg,rgba(124,58,237,.6),rgba(236,72,153,.5));color:#fff;border-color:#c084fc}
.action-btn i{font-size:18px}.action-btn span{font-weight:800;font-size:8px}
.weapon-actions{position:fixed;right:14px;bottom:calc(200px + env(safe-area-inset-bottom));z-index:20;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.weapon-actions>*{pointer-events:auto}
.wa-btn{width:60px;height:60px;border-radius:50%;border:2px solid rgba(251,191,36,.6);background:radial-gradient(circle,rgba(251,191,36,.25),rgba(15,11,26,.95));color:#fbbf24;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:.15s;touch-action:manipulation}
.wa-btn:active{transform:scale(.9)}
.wa-btn.skill{border-color:rgba(236,72,153,.7);color:#f472b6;width:52px;height:52px}
.wa-btn i{font-size:18px}.wa-btn span{font-weight:800;font-size:7px}
.wa-btn.cooldown{opacity:.4;pointer-events:none}
#toast{position:fixed;bottom:calc(180px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(120px);z-index:9999;padding:10px 18px;border-radius:12px;background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;font-weight:800;font-size:12px;transition:transform .35s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
.emote-panel,.fly-panel,.weather-panel{position:fixed;right:10px;bottom:calc(120px + env(safe-area-inset-bottom));z-index:25;width:min(280px,calc(100vw - 20px));max-height:min(50dvh,360px);display:none;flex-direction:column;background:linear-gradient(145deg,rgba(15,11,30,.98),rgba(8,6,20,.98));border:1px solid rgba(139,92,246,.35);border-radius:16px;overflow:hidden;color:#e7faff}
.emote-panel.on,.fly-panel.on,.weather-panel.on{display:flex}
.emote-head,.fp-head,.wp-head{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid rgba(139,92,246,.2);font-weight:800;font-size:10px;color:#c4b5fd;text-transform:uppercase;flex-shrink:0}
.emote-head button,.fp-head button,.wp-head button{margin-left:auto;width:24px;height:24px;border-radius:6px;border:1px solid rgba(139,92,246,.3);background:rgba(30,24,48,.8);color:#c4b5fd;cursor:pointer;font-size:11px}
.emote-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px;overflow-y:auto;flex:1}
.emote-item{aspect-ratio:1;border-radius:10px;border:1.5px solid rgba(139,92,246,.2);background:rgba(30,24,48,.7);color:#f5f3ff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:4px;transition:.15s}
.emote-item.active{background:linear-gradient(135deg,#7c3aed,#ec4899);border-color:#c084fc;color:#fff}
.emote-item i{font-size:14px;color:#a78bfa}
.emote-item.active i{color:#fff}
.emote-item span{font-weight:800;font-size:8px;text-align:center}
.fly-panel{padding:14px;gap:10px}
.fly-panel .fp-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:11px}
.fly-panel input[type=range]{grid-column:1/-1;width:100%;accent-color:#52d8ef}
.fly-panel .fp-toggle{display:flex;align-items:center;justify-content:space-between;padding:9px 10px;border-radius:10px;background:rgba(21,52,66,.8);font-size:11px;font-weight:800}
.fly-panel .fp-actions{display:flex;gap:8px}
.fly-panel .fp-actions button{flex:1;padding:9px;border-radius:10px;border:1px solid rgba(107,231,255,.35);background:rgba(18,52,68,.9);color:#c9f9ff;font-size:11px;font-weight:800;cursor:pointer}
.weather-panel{padding:12px;gap:8px}
.weather-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.weather-item{padding:12px 8px;border-radius:10px;border:1.5px solid rgba(139,92,246,.25);background:rgba(30,24,48,.7);color:#f5f3ff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;transition:.15s;font-size:10px;font-weight:800}
.weather-item i{font-size:20px;color:#a78bfa}
.weather-item.active{background:linear-gradient(135deg,#7c3aed,#ec4899);border-color:#c084fc;color:#fff}
.weather-item.active i{color:#fff}
.weather-item:active{transform:scale(.95)}
.time-row{display:flex;gap:8px;margin-top:4px}
.time-row button{flex:1;padding:10px;border-radius:10px;border:1.5px solid rgba(139,92,246,.3);background:rgba(30,24,48,.8);color:#e7faff;font-size:11px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
.time-row button.active{background:linear-gradient(135deg,#fbbf24,#f97316);border-color:#fbbf24;color:#1a0f2e}
#loading{position:fixed;inset:0;z-index:99999;background:radial-gradient(circle at center,#150a2e,#050a16);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .5s}
#loading.hide{opacity:0;pointer-events:none}
#loading .logo{width:70px;height:70px;border-radius:20px;background:linear-gradient(135deg,#7c3aed,#ec4899);display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;animation:pulse 2s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
#loading .title{font-weight:900;font-size:18px;background:linear-gradient(135deg,#a78bfa,#ec4899,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px}
#loading .status{font-weight:700;font-size:12px;color:#8b83a8}
#loading .spin{width:36px;height:36px;border:3px solid rgba(124,58,237,.2);border-top-color:#a78bfa;border-radius:50%;animation:spin 1s infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:420px){.joystick{width:112px;height:112px}.joystick-knob{width:46px;height:46px}.action-btn{width:56px;height:60px}.weapon-item{width:46px;height:46px}.wa-btn{width:54px;height:54px}.wa-btn.skill{width:48px;height:48px}.hud-btn{width:34px;height:34px;font-size:12px}}
</style>
</head>
<body>

<div id="loading">
  <div class="logo"><i class="fas fa-dragon"></i></div>
  <div class="title">OPEN WORLD RPG</div>
  <div class="spin"></div>
  <div class="status" id="loadStatus">Đang khởi tạo...</div>
</div>

<div id="game"></div>

<div class="hud-top">
  <button class="hud-btn" id="btnExit"><i class="fas fa-arrow-left"></i></button>
  <div class="hud-title" id="hudTitle">SAKURA SANCTUARY<small>LÀNG HOA ANH ĐÀO</small></div>
  <button class="hud-btn" id="btnWeather" title="Thời tiết"><i class="fas fa-cloud-sun"></i></button>
  <button class="hud-btn" id="btnDayNight" title="Ngày/Đêm"><i class="fas fa-moon"></i></button>
  <button class="hud-btn" id="btnFly"><i class="fas fa-feather-pointed"></i></button>
</div>

<div class="placeholder-row">
  <div class="placeholder-btn"><i class="fas fa-user-astronaut"></i></div>
  <div class="placeholder-btn"><i class="fas fa-box-open"></i></div>
  <div class="placeholder-btn"><i class="fas fa-scroll"></i></div>
  <div class="placeholder-btn"><i class="fas fa-gear"></i></div>
</div>

<div class="weapon-dock" id="weaponDock"></div>

<div class="weapon-actions">
  <button class="wa-btn skill" id="btnSkill"><i class="fas fa-wand-magic-sparkles"></i><span>SKILL</span></button>
  <button class="wa-btn" id="btnAttack"><i class="fas fa-hand-fist"></i><span>ATK</span></button>
</div>

<div class="controls-bottom">
  <div class="joystick" id="joystick">
    <div class="joystick-ring"></div>
    <div class="joystick-knob" id="joystickKnob"><i class="fas fa-arrows-up-down-left-right"></i></div>
  </div>
  <div class="actions">
    <button class="action-btn" id="btnJump"><i class="fas fa-arrow-up"></i><span>NHẢY</span></button>
    <button class="action-btn" id="btnRun"><i class="fas fa-person-running"></i><span>CHẠY</span></button>
    <button class="action-btn" id="btnEmote"><i class="fas fa-face-smile"></i><span>EMOTE</span></button>
  </div>
</div>

<div class="emote-panel" id="emotePanel">
  <div class="emote-head"><i class="fas fa-wand-magic-sparkles"></i> EMOTE<button id="emoteClose">✕</button></div>
  <div class="emote-grid" id="emoteGrid"></div>
</div>

<div class="fly-panel" id="flyPanel">
  <div class="fp-head"><span><i class="fas fa-gauge-high"></i> BAY / SPEED</span><button id="flyClose" style="border:none;background:none;color:#9df3ff;cursor:pointer;font-size:14px">✕</button></div>
  <label class="fp-row"><span>Tốc độ di chuyển</span><b id="speedVal">5.0</b><input id="speedRange" type="range" min="1" max="18" step="0.5" value="5"></label>
  <label class="fp-row"><span>Độ cao bay</span><b id="flyHeightVal">12 m</b><input id="flyHeightRange" type="range" min="2" max="35" step="1" value="12"></label>
  <label class="fp-row"><span>Tốc độ bay</span><b id="flySpeedVal">10</b><input id="flySpeedRange" type="range" min="2" max="30" step="1" value="10"></label>
  <label class="fp-toggle"><span><i class="fas fa-feather-pointed"></i> Bật bay</span><input id="flyToggle" type="checkbox" style="accent-color:#52d8ef;width:18px;height:18px"></label>
  <div class="fp-actions"><button id="flyUp"><i class="fas fa-arrow-up"></i> Lên</button><button id="flyDown"><i class="fas fa-arrow-down"></i> Xuống</button></div>
</div>

<div class="weather-panel" id="weatherPanel">
  <div class="wp-head"><span><i class="fas fa-cloud-sun"></i> THỜI TIẾT</span><button id="weatherClose">✕</button></div>
  <div class="weather-grid" id="weatherGrid"></div>
  <div class="time-row">
    <button id="timeDay"><i class="fas fa-sun"></i> NGÀY</button>
    <button id="timeNight"><i class="fas fa-moon"></i> ĐÊM</button>
  </div>
</div>

<div id="toast"></div>

<!-- ============================================================
     1. WEAPON VFX ENGINE
     ============================================================ -->
<script id="weapon-vfx-engine">
window.WeaponVFX=(function(){
'use strict';
const L=10.5,R=46.0,W=0.46,T=0.09,H=3.2,PHI_MAX=L/R;
const BLADE_PROFILE=[[-0.50,0.00],[0.24,1.00],[0.50,0.42],[0.50,-0.42],[0.24,-1.00]];
function tipTaper(u,s){s=s||.87;if(u<=s)return 1;const t=(u-s)/(1-s);return 1-.97*(t*t*(3-2*t));}
function makeBladeTexture(hue){const w=512,h=128,cv=document.createElement('canvas');cv.width=w;cv.height=h;const ctx=cv.getContext('2d');const base=new THREE.Color().setHSL(hue,.85,.15),mid=new THREE.Color().setHSL(hue,.9,.42),bright=new THREE.Color().setHSL(hue,1,.72);const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'#'+base.getHexString());g.addColorStop(.14,'#'+mid.getHexString());g.addColorStop(.5,'#'+bright.getHexString());g.addColorStop(.86,'#'+mid.getHexString());g.addColorStop(1,'#'+base.getHexString());ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.globalCompositeOperation='lighter';for(let i=0;i<40;i++){ctx.fillStyle='rgba(255,255,255,'+(0.03+Math.random()*0.08)+')';ctx.fillRect(Math.random()*w,0,Math.random()*30,h);}ctx.globalCompositeOperation='source-over';ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;ctx.beginPath();for(let x=0;x<=w;x+=6){const y=h*.5+Math.sin(x*.06)*8+Math.sin(x*.13)*3;if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);}ctx.stroke();const tex=new THREE.CanvasTexture(cv);tex.wrapS=THREE.RepeatWrapping;tex.anisotropy=8;return tex;}
function makeTsukaTexture(){const s=256,cv=document.createElement('canvas');cv.width=cv.height=s;const ctx=cv.getContext('2d');ctx.fillStyle='#141014';ctx.fillRect(0,0,s,s);for(let i=-s;i<s*2;i+=66){ctx.strokeStyle='#6a4a9a';ctx.lineWidth=28;ctx.lineCap='square';ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i+s,s);ctx.stroke();ctx.beginPath();ctx.moveTo(i,s);ctx.lineTo(i+s,0);ctx.stroke();}const tex=new THREE.CanvasTexture(cv);tex.wrapS=tex.wrapT=THREE.RepeatWrapping;tex.anisotropy=8;tex.repeat.set(1.4,2.4);return tex;}
function makeGlowTexture(){const s=128,cv=document.createElement('canvas');cv.width=cv.height=s;const ctx=cv.getContext('2d');const g=ctx.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.15,'rgba(255,255,255,1)');g.addColorStop(.4,'rgba(255,255,255,.55)');g.addColorStop(.7,'rgba(255,255,255,.15)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(0,0,s,s);return new THREE.CanvasTexture(cv);}
function makePetalTexture(){const s=128,cv=document.createElement('canvas');cv.width=cv.height=s;const ctx=cv.getContext('2d');ctx.translate(s/2,s/2);ctx.fillStyle='rgba(255,255,255,1)';for(let i=0;i<5;i++){ctx.save();ctx.rotate(i*Math.PI*2/5);ctx.beginPath();ctx.ellipse(0,-s*.22,s*.13,s*.22,0,0,Math.PI*2);ctx.fill();ctx.restore();}ctx.beginPath();ctx.arc(0,0,s*.08,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.9)';ctx.fill();return new THREE.CanvasTexture(cv);}
function makeSparkTexture(){const w=64,h=128,cv=document.createElement('canvas');cv.width=w;cv.height=h;const ctx=cv.getContext('2d');const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.3,'rgba(255,255,255,.9)');g.addColorStop(.7,'rgba(255,255,255,1)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fillRect(w*.35,0,w*.3,h);return new THREE.CanvasTexture(cv);}
function makeSmokeTexture(){const s=256,cv=document.createElement('canvas');cv.width=cv.height=s;const ctx=cv.getContext('2d');for(let i=0;i<12;i++){const x=s/2+(Math.random()-.5)*s*.5,y=s/2+(Math.random()-.5)*s*.5,r=s*(.15+Math.random()*.25);const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba(255,255,255,.35)');g.addColorStop(.5,'rgba(255,255,255,.12)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();}return new THREE.CanvasTexture(cv);}
function makeFireTexture(){const s=128,cv=document.createElement('canvas');cv.width=cv.height=s;const ctx=cv.getContext('2d');const g=ctx.createRadialGradient(s/2,s*.7,0,s/2,s*.7,s*.5);g.addColorStop(0,'rgba(255,255,200,1)');g.addColorStop(.25,'rgba(255,200,50,.9)');g.addColorStop(.5,'rgba(255,100,0,.6)');g.addColorStop(.8,'rgba(200,30,0,.2)');g.addColorStop(1,'rgba(100,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(s*.5,s*.1);ctx.quadraticCurveTo(s*.7,s*.4,s*.65,s*.6);ctx.quadraticCurveTo(s*.6,s*.8,s*.5,s*.9);ctx.quadraticCurveTo(s*.4,s*.8,s*.35,s*.6);ctx.quadraticCurveTo(s*.3,s*.4,s*.5,s*.1);ctx.fill();return new THREE.CanvasTexture(cv);}
function makeBoltTexture(){const s=128,cv=document.createElement('canvas');cv.width=cv.height=s;const ctx=cv.getContext('2d');ctx.strokeStyle='rgba(255,255,255,1)';ctx.lineWidth=4;ctx.shadowColor='rgba(0,255,220,1)';ctx.shadowBlur=12;ctx.beginPath();ctx.moveTo(s*.5,0);ctx.lineTo(s*.35,s*.35);ctx.lineTo(s*.55,s*.38);ctx.lineTo(s*.3,s*.7);ctx.lineTo(s*.45,s*.72);ctx.lineTo(s*.2,s);ctx.stroke();return new THREE.CanvasTexture(cv);}
const tex={glow:makeGlowTexture(),petal:makePetalTexture(),spark:makeSparkTexture(),smoke:makeSmokeTexture(),fire:makeFireTexture(),bolt:makeBoltTexture()};
window.WeaponVFX_glowTex = tex.glow;

function buildSweep(profile,segs,frameAt){const m=profile.length,n=m+1,positions=[],uvs=[],indices=[];for(let i=0;i<=segs;i++){const u=i/segs,f=frameAt(u);for(let j=0;j<n;j++){const pr=profile[j%m];positions.push(f.cx+f.nx*pr[0]*f.sw,f.cy+f.ny*pr[0]*f.sw,pr[1]*f.st);uvs.push(u*(f.uv||1),j/m);}}for(let i=0;i<segs;i++){for(let j=0;j<m;j++){const a=i*n+j,b=a+1,c=(i+1)*n+j,d=c+1;indices.push(a,c,b,b,c,d);}}for(let j=1;j<m-1;j++)indices.push(0,j,j+1);const base=segs*n;for(let j=1;j<m-1;j++)indices.push(base,base+j+1,base+j);const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.Float32BufferAttribute(positions,3));geo.setAttribute('uv',new THREE.Float32BufferAttribute(uvs,2));geo.setIndex(indices);geo.computeVertexNormals();return geo;}

// Gắn vũ khí vào đúng vị trí bàn tay, để phần cán nằm trong lòng bàn tay và lưỡi hướng ra ngoài.
function setHandMountPose(id,xAxis,yAxis,zAxis,gripPoint,weaponScale=1){
  const mount=weaponMounts[id];
  if(!mount)return;
  const basis=new THREE.Matrix4().makeBasis(xAxis,yAxis,zAxis);
  mount.quaternion.setFromRotationMatrix(basis);
  mount.scale.setScalar(weaponScale);
  mount.position.copy(gripPoint).multiplyScalar(weaponScale).applyQuaternion(mount.quaternion).negate();
}

function configureHandWeaponMounts(){
  const legacyRotation=new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.PI/2,0,Math.PI/2,'XYZ'));
  const oldOrigin=new THREE.Vector3(0.02,-0.52,0.33);
  const wristOrigin=new THREE.Vector3(0.02,-0.52,0.085);
  ['katana','scythe'].forEach(id=>{
    const mount=weaponMounts[id];
    if(!mount)return;
    mount.quaternion.copy(legacyRotation);
    mount.position.copy(oldOrigin).sub(wristOrigin).multiplyScalar(1/WEAPON_SCALE);
    mount.scale.setScalar(1);
  });
  setHandMountPose('pan',
    new THREE.Vector3(0,-1,0),
    new THREE.Vector3(0,0,1),
    new THREE.Vector3(-1,0,0),
    new THREE.Vector3(0,0,2.75),
    1.18
  );
  // Kunai va dao: mui huong truoc theo +Z, dong thoi xoay mat phang luoi dung thang thay vi ngua len troi.
  setHandMountPose('kunai',
    new THREE.Vector3(0,1,0),
    new THREE.Vector3(0,0,1),
    new THREE.Vector3(1,0,0),
    new THREE.Vector3(0,-.08,0),
    1.7
  );
  setHandMountPose('knife',
    new THREE.Vector3(0,1,0),
    new THREE.Vector3(0,0,1),
    new THREE.Vector3(1,0,0),
    new THREE.Vector3(0,-.32,0),
    1.6
  );
}

function attachToHand(handGroup,playerRoot){
  if(!weaponHolder||!handGroup)return;
  if(katana && katana.sayaGroup.parent === katana.group){
    katana.group.remove(katana.sayaGroup);
    if(sayaHolder.parent) sayaHolder.parent.remove(sayaHolder);
    if(playerRoot) playerRoot.add(sayaHolder);
    sayaHolder.position.set(0.02, 1.18, -0.28);
    sayaHolder.rotation.set(0.15, 0.45, -0.35);
    sayaHolder.scale.setScalar(WEAPON_SCALE * 0.85);
  }
  if(weaponHolder.parent)weaponHolder.parent.remove(weaponHolder);
  handGroup.add(weaponHolder);
  weaponHolder.position.set(0.02,-0.52,0.085);
  weaponHolder.rotation.set(0,0,0);
  weaponHolder.scale.setScalar(WEAPON_SCALE);
  configureHandWeaponMounts();
}

function attachToBack(playerRoot){
  if(!weaponHolder||!playerRoot)return;
  // Gắn lại vỏ kiếm vào thanh kiếm khi cất
  if(katana && katana.sayaGroup.parent === sayaHolder){
    sayaHolder.remove(katana.sayaGroup);
    katana.group.add(katana.sayaGroup);
    if(sayaHolder.parent) sayaHolder.parent.remove(sayaHolder);
  }
  if(weaponHolder.parent)weaponHolder.parent.remove(weaponHolder);
  playerRoot.add(weaponHolder);
  Object.values(weaponMounts).forEach(m=>{m.position.set(0,0,0);m.rotation.set(0,0,0);m.scale.setScalar(1);});
  weaponHolder.position.set(0.02, 1.18, -0.28);
  weaponHolder.rotation.set(0.15, 0.45, -0.35);
  weaponHolder.scale.setScalar(WEAPON_SCALE * 0.85);
}

function setDrawState(state,playerRoot,handGroup){
  currentDraw=state;
  if(state > 0.5){
    attachToHand(handGroup,playerRoot);
  } else {
    attachToBack(playerRoot);
  }
  if(katana)katana.pivot.rotation.z = 0;
  weaponHolder.visible = currentVfx !== 'none';
}

function setVfx(type){
  const c=VFX_CONFIG[type];if(!c)return;
  currentVfx=type;
  katana.group.visible=c.weapon==='katana';scythe.group.visible=c.weapon==='scythe';pan.group.visible=c.weapon==='pan';kunai.group.visible=c.weapon==='kunai';knife.group.visible=c.weapon==='knife';
  if(type==='none'){
    if(activeVfx&&activeVfx.group.parent)activeVfx.group.parent.remove(activeVfx.group);
    activeVfx=null;vfxGroup=null;
    if(weaponHolder)weaponHolder.visible=false;
    if(auraLight)auraLight.intensity=0;
    if(window.__weaponUIUpdate)window.__weaponUIUpdate(type);
    return;
  }
  if(weaponHolder)weaponHolder.visible=true;
  if(c.weapon==='katana'){katana.matBlade.map=makeBladeTexture(c.bladeHue);katana.matBlade.emissive=new THREE.Color().setHSL(c.bladeHue,.9,.35);katana.matBlade.needsUpdate=true;katana.matSaya.color=new THREE.Color().setHSL(c.sayaHue,.8,.15);katana.matSaya.emissive=new THREE.Color().setHSL(c.sayaHue,.8,.1);katana.matSaya.needsUpdate=true;}
  if(activeVfx&&activeVfx.group.parent)activeVfx.group.parent.remove(activeVfx.group);
  activeVfx=c.create();
  let attach=katana.sword;if(c.weapon==='scythe')attach=scythe.group;else if(c.weapon==='pan')attach=pan.group;else if(c.weapon==='kunai')attach=kunai.group;else if(c.weapon==='knife')attach=knife.inner;
  vfxGroup=new THREE.Group();attach.add(vfxGroup);vfxGroup.add(activeVfx.group);
  if(auraLight)auraLight.color.setHex(c.color);
  if(window.__weaponUIUpdate)window.__weaponUIUpdate(type);
}

function update(t,dt){
  if(!weaponHolder)return;
  const c=VFX_CONFIG[currentVfx];
  const isDrawn = currentDraw > 0.5;
  if(!isDrawn){
    if(auraLight && weaponHolder){
      weaponHolder.localToWorld(_p.set(0,0.3,0));
      auraLight.position.copy(_p);
      auraLight.intensity = 1.5 * (0.8 + Math.sin(t*8)*0.2);
    }
    return;
  }
  if(c.weapon==='katana'&&activeVfx){
    if(currentVfx==='sakura')activeVfx.petals.forEach(s=>{const p=s.userData;p.u=(p.u+dt*p.speed*.18)%1;getBladePoint(p.u,_p);const a=p.phase+t*1.8,r=.9+Math.sin(t*1.5+p.phase)*.5;_p.x+=Math.cos(a)*r+p.offset;_p.y+=Math.sin(a)*r+Math.sin(t*.7+p.phase)*.25;_p.z+=Math.sin(a*2)*r;s.position.copy(_p);s.material.opacity=.7+Math.sin(t*3+p.phase)*.25;});
    else if(currentVfx==='nebula'){activeVfx.clouds.forEach(s=>{const p=s.userData;p.u=(p.u+dt*p.speed*.12)%1;getBladePoint(p.u,_p);const a=p.phase+t*.8,r=1.2+Math.sin(t*1.5+p.phase)*.6;_p.x+=Math.cos(a)*r+p.offset;_p.y+=Math.sin(a)*r;_p.z+=Math.sin(a*1.5)*r;s.position.copy(_p);s.material.opacity=.35+Math.sin(t*2+p.phase)*.2;});activeVfx.sparks.forEach(s=>{const p=s.userData;p.u=(p.u+dt*p.speed*.4)%1;getBladePoint(p.u,_p);const a=p.phase+t*3,r=1.5+Math.sin(t*2+p.phase)*.7;_p.x+=Math.cos(a)*r+p.offset;_p.y+=Math.sin(a)*r;_p.z+=Math.sin(a*2)*r;s.position.copy(_p);s.material.opacity=.6+Math.sin(t*5+p.phase)*.4;});}
    else if(currentVfx==='crystal'){activeVfx.crystals.forEach((cr,i)=>{const p=cr.userData;p.u=(p.u+dt*p.speed*.2)%1;getBladePoint(p.u,_p);const a=p.phase+t*1.8,r=.7+Math.sin(t*2+p.phase)*.4;_p.x+=Math.cos(a)*r+p.offset;_p.y+=Math.sin(a)*r;_p.z+=Math.sin(a*1.5)*r;cr.position.copy(_p);cr.rotation.x+=dt*2.5;cr.rotation.y+=dt*3.5;cr.rotation.z+=p.rotSpeed*dt;cr.scale.setScalar(p.scale*(.85+Math.sin(t*4+i)*.15));});activeVfx.rings.forEach(ring=>{const p=ring.userData;getBladePoint(.5,_p);ring.position.copy(_p);ring.rotation.x=t*p.speed;ring.rotation.y=t*p.speed*.7+p.phase;ring.material.opacity=.4+Math.sin(t*3+p.phase)*.25;});}
    else if(currentVfx==='blood'){activeVfx.mists.forEach(s=>{const p=s.userData;p.u=(p.u+dt*p.speed*.12)%1;getBladePoint(p.u,_p);const a=p.phase+t*1.2,r=1.2+Math.sin(t*1.8+p.phase)*.6;_p.x+=Math.cos(a)*r+p.offset;_p.y+=Math.sin(a)*r;_p.z+=Math.sin(a*1.5)*r;s.position.copy(_p);s.material.opacity=.35+Math.sin(t*2+p.phase)*.2;});activeVfx.drops.forEach(s=>{const p=s.userData;p.u=(p.u+dt*p.speed*.25)%1;getBladePoint(p.u,_p);_p.x+=(Math.random()-.5)*2;_p.y+=(Math.random()-.5)*2;_p.z+=(Math.random()-.5)*2;s.position.copy(_p);s.material.opacity=.7+Math.sin(t*6+p.phase)*.3;});}
  }else if(c.weapon==='scythe'&&activeVfx){activeVfx.auras.forEach(s=>{const p=s.userData;p.angle+=p.speed*dt;const r=p.radius*(1+Math.sin(t*.7+p.phase)*.25);s.position.set(Math.cos(p.angle)*r,Math.sin(t*.5+p.phase)*.5,Math.sin(p.angle)*r);s.material.opacity=.6+Math.sin(t*1.5+p.phase)*.2;});activeVfx.souls.forEach(s=>{const p=s.userData;p.yOff+=p.speed*dt*.8;if(p.yOff>3.5)p.yOff=0;p.angle+=dt*1.2;const r=p.radius*(.7+Math.sin(t*2+p.phase)*.3);s.position.set(Math.cos(p.angle)*r,-.8+p.yOff,Math.sin(p.angle)*r);s.material.opacity=.7+Math.sin(t*5+p.phase)*.3;});}
  else if(c.weapon==='pan'&&activeVfx){activeVfx.flames.forEach(s=>{const p=s.userData;p.angle+=p.speed*dt*.8;const r=p.radius*(1+Math.sin(t*2+p.phase)*.15);s.position.set(Math.cos(p.angle)*r,p.yBase+Math.sin(t*3+p.phase)*.3+.2,Math.sin(p.angle)*r);s.material.opacity=.6+Math.sin(t*4+p.phase)*.3;s.scale.setScalar(p.scale*(.8+Math.sin(t*5+p.phase)*.2));});activeVfx.embers.forEach(s=>{const p=s.userData;p.yOff+=p.speed*dt*.7;if(p.yOff>2)p.yOff=0;p.angle+=dt*.6;const r=p.radius*(.9+Math.sin(t*2+p.phase)*.1);s.position.set(Math.cos(p.angle)*r,p.yOff+.2,Math.sin(p.angle)*r);s.material.opacity=.5+Math.sin(t*6+p.phase)*.5;});activeVfx.ring1.rotation.z+=dt*1.5;}
  else if(c.weapon==='kunai'&&activeVfx){activeVfx.bolts.forEach(s=>{const p=s.userData;p.angle+=p.speed*dt*.7;const r=p.radius*(1+Math.sin(t*2+p.phase)*.2);s.position.set(Math.cos(p.angle)*r,p.yOff+.6+Math.sin(t*3+p.phase)*.3,Math.sin(p.angle)*r);s.material.opacity=.5+Math.sin(t*5+p.phase)*.4;s.scale.setScalar(p.scale*(.8+Math.sin(t*6+p.phase)*.25));});activeVfx.particles.forEach(s=>{const p=s.userData;p.angle+=p.speed*dt*1.2;const r=p.radius*(.9+Math.sin(t*2.5+p.phase)*.15);s.position.set(Math.cos(p.angle)*r,p.yOff+.6+Math.sin(t*4+p.phase)*.4,Math.sin(p.angle)*r);s.material.opacity=.6+Math.sin(t*7+p.phase)*.4;});activeVfx.rings.forEach(ring=>{const p=ring.userData;ring.rotation.x=t*p.speed;ring.rotation.y=t*p.speed*.7+p.phase;ring.position.y=.6+Math.sin(t*1.5+p.phase)*.3;ring.material.opacity=.4+Math.sin(t*3+p.phase)*.25;});}
  else if(c.weapon==='knife'&&activeVfx){activeVfx.slashes.forEach(s=>{const p=s.userData;p.angle+=p.speed*dt*.9;const r=p.radius*(1+Math.sin(t*2.5+p.phase)*.2);s.position.set(Math.cos(p.angle)*r,p.yOff+.5+Math.sin(t*3.5+p.phase)*.3,Math.sin(p.angle)*r);s.material.opacity=.5+Math.sin(t*5.5+p.phase)*.45;});activeVfx.embers.forEach(s=>{const p=s.userData;p.angle+=p.speed*dt*1.1;const r=p.radius*(.85+Math.sin(t*2.2+p.phase)*.15);s.position.set(Math.cos(p.angle)*r,p.yOff+.5+Math.sin(t*4.5+p.phase)*.4,Math.sin(p.angle)*r);s.material.opacity=.6+Math.sin(t*7.5+p.phase)*.4;});activeVfx.rings.forEach(ring=>{const p=ring.userData;ring.rotation.x=t*p.speed;ring.rotation.y=t*p.speed*.6+p.phase;ring.position.y=.5+Math.sin(t*1.8+p.phase)*.3;ring.material.opacity=.4+Math.sin(t*3.5+p.phase)*.25;});}

  if(auraLight){if(c.weapon==='katana'){getBladePoint(.5,_p);katana.sword.localToWorld(_p);auraLight.position.copy(_p);}else if(c.weapon==='scythe'){scythe.group.localToWorld(_p.set(-1,2.5,0));auraLight.position.copy(_p);}else if(c.weapon==='pan'){pan.group.localToWorld(_p.set(0,.2,0));auraLight.position.copy(_p);}else if(c.weapon==='kunai'){kunai.group.localToWorld(_p.set(0,.8,0));auraLight.position.copy(_p);}else if(c.weapon==='knife'){knife.group.localToWorld(_p.set(0,.8,0));auraLight.position.copy(_p);}auraLight.intensity=2*(.8+Math.sin(t*8)*.2);}
  if(katana&&c.weapon==='katana')katana.pivot.position.y=R+Math.sin(t*.8)*.04;
  if(katana&&katana.sayaGroup.parent===katana.group)katana.sayaGroup.position.y=Math.sin(t*.8+.35)*.04;
}

function setDraw(v){if(katana)katana.pivot.rotation.z=0;}

return{init,setVfx,update,setDraw,setDrawState,attachToHand,attachToBack,listWeapons:()=>[{id:'none',name:'Tay không',emoji:'👊',color:'#aaaaaa'},{id:'sakura',name:'Sakura',emoji:'🌸',color:'#ff66cc'},{id:'nebula',name:'Tinh Vân',emoji:'🌌',color:'#b46cff'},{id:'crystal',name:'Pha Lê',emoji:'💠',color:'#00e5ff'},{id:'blood',name:'Huyết Nguyệt',emoji:'🩸',color:'#ff2a2a'},{id:'reaper',name:'Lưỡi Hái',emoji:'🌾',color:'#8800ff'},{id:'pan',name:'Chảo FF',emoji:'🍳',color:'#ffaa00'},{id:'kunai',name:'Kunai',emoji:'🗡️',color:'#00ffcc'},{id:'knife',name:'Dao Thường',emoji:'🔪',color:'#ff4466'}],getCurrent:()=>currentVfx,getDrawState:()=>currentDraw};
})();

    const abdomen=new THREE_REF.Mesh(new THREE_REF.BoxGeometry(1.5,1.1,1.5),spiderMat);abdomen.position.set(0,.75,.9);abdomen.castShadow=true;root.add(abdomen);

function addBalancedTrees(p, region){
  const isSakura = (region === 0);
  const isAutumn = (region === 1);
  if(!isSakura && !isAutumn) return;
  
  const treeCount = 45;
  for(let i=0; i<treeCount; i++){
    let x, z, valid = false, attempts = 0;
    while(!valid && attempts < 30){
      x = (random() - 0.5) * 110;
      z = (random() - 0.5) * 110;
      if(Math.abs(x) < 20 && z > -28 && z < 28) { attempts++; continue; }
      if(Math.abs(x) < 4 && z > -24 && z < 24) { attempts++; continue; }
      if(Math.abs(x + 23) < 9 && Math.abs(z + 4) < 7) { attempts++; continue; }
      let tooClose = false;
      for(const t of treeData){
        if(Math.hypot(x - t.x, z - t.z) < 4.5) { tooClose = true; break; }
      }
      if(tooClose) { attempts++; continue; }
      valid = true;
    }
    if(!valid) continue;
    const s = 0.9 + random() * 1.4;
    treeData.push({
      x, z, s,
      kind: isSakura ? 'sakura' : 'sakura',
      phase: random() * Math.PI * 2
    });
  }
  
  for(let i=0; i<8; i++){
    let x = (random() - 0.5) * 100;
    let z = (random() - 0.5) * 100;
    if(Math.abs(x) < 20 && z > -28 && z < 28) continue;
    if(Math.abs(x) < 4 && z > -24 && z < 24) continue;
    let tooClose = false;
    for(const t of treeData){
      if(Math.hypot(x - t.x, z - t.z) < 4) { tooClose = true; break; }
    }
    if(tooClose) continue;
    treeData.push({
      x, z, s: 0.7 + random() * 1.0,
      kind: 'pine',
      phase: random() * Math.PI * 2
    });
  }
  
  for(let i=0; i<12; i++){
    const z = 26 - i * 2.5;
    const x = Math.sin(i * 0.2) * 7 + (random() - 0.5) * 5;
    if(Math.abs(x) < 3.5) continue;
    treeData.push({
      x, z, s: 0.8 + random() * 1.1,
      kind: isSakura ? 'sakura' : 'sakura',
      phase: random() * Math.PI * 2
    });
  }
  
  buildForest(p);
  
  const petalCount = isSakura ? 35 : 25;
  const flowerColors = isSakura ? p.flower : [0xff3333, 0xcc2200, 0xff6644, 0xdd4422];
  for(let i=0; i<petalCount; i++){
    const x = (random() - 0.5) * 90;
    const z = (random() - 0.5) * 90;
    if(Math.abs(x) < 14 && Math.abs(z) < 28) continue;
    const color = flowerColors[i % flowerColors.length];
    makePetal(x, z, color);
  }
  
  for(let i=0; i<25; i++){
    const x = (random() - 0.5) * 95;
    const z = (random() - 0.5) * 95;
    if(Math.abs(x) < 16 && Math.abs(z) < 28) continue;
    makeBush(x, z, 0.5 + random() * 0.8, p);
  }
}

function pointBlocked(x,z,r){
  r=r||.68;
  if(!Number.isFinite(x)||!Number.isFinite(z))return true;
  const z0=zoneAtGlobal(x,z);if(!z0)return true;
  const lx=x-z0.cx,lz=z-z0.cz;
  if(z0.i===3){
    const island=Math.hypot(lx,lz)<=28.8;
    const nB=Math.abs(lx)<=3.2&&lz>=-66&&lz<=-22;
    const eB=Math.abs(lz)<=3.2&&lx>=22&&lx<=66;
    if(!island&&!nB&&!eB)return true;
  }
  for(const c of colliders){if(Math.abs(x-c.x)<c.hx+r+c.pad&&Math.abs(z-c.z)<c.hz+r+c.pad)return true;}
  return false;
}
return{build,heightAt:heightGlobal,zoneAt:zoneAtGlobal,pointBlocked,PALETTE};

function updateWeather(dt,t){
  if(!weatherParticles||!player)return;
  const pos=weatherParticles.geometry.attributes.position;
  const arr=pos.array;
  const px=player.position.x,py=player.position.y,pz=player.position.z;
  const type=weatherParticles.userData.type;
  if(type==='rain'){
    const vel=weatherParticles.geometry.userData.vel;
    const n=arr.length/3;
    for(let i=0;i<n;i++){
      arr[i*3+1]-=vel[i]*dt;
      if(arr[i*3+1]<py-3){
        arr[i*3+1]=py+32;
        arr[i*3]=(Math.random()-.5)*70+px;
        arr[i*3+2]=(Math.random()-.5)*70+pz;
      }
      const dx=arr[i*3]-px, dz=arr[i*3+2]-pz;
      if(dx>36)arr[i*3]=px-36+Math.random()*2;
      if(dx<-36)arr[i*3]=px+36-Math.random()*2;
      if(dz>36)arr[i*3+2]=pz-36+Math.random()*2;
      if(dz<-36)arr[i*3+2]=pz+36-Math.random()*2;
    }
    pos.needsUpdate=true;
  } else if(type==='snow'){
    const seed=weatherParticles.geometry.userData.seed;
    const n=arr.length/3;
    for(let i=0;i<n;i++){
      arr[i*3+1]-=(2.2+Math.sin(seed[i])*1.5)*dt;
      arr[i*3]+=Math.sin(t*1.2+seed[i])*0.6*dt;
      arr[i*3+2]+=Math.cos(t*1.4+seed[i])*0.6*dt;
      if(arr[i*3+1]<py-2){
        arr[i*3+1]=py+32;
        arr[i*3]=(Math.random()-.5)*70+px;
        arr[i*3+2]=(Math.random()-.5)*70+pz;
      }
      const dx=arr[i*3]-px, dz=arr[i*3+2]-pz;
      if(dx>36)arr[i*3]=px-36+Math.random()*2;
      if(dx<-36)arr[i*3]=px+36-Math.random()*2;
      if(dz>36)arr[i*3+2]=pz-36+Math.random()*2;
      if(dz<-36)arr[i*3+2]=pz+36-Math.random()*2;
    }
    pos.needsUpdate=true;
  }
  if(weatherType==='storm'){
    lightningT-=dt;
    if(lightningT<=0){

      ftick();
    }
  }
}

joystick.addEventListener('pointermove',e=>{if(!joyActive||e.pointerId!==joyId)return;moveJoy(e);e.preventDefault();});
joystick.addEventListener('pointerup',e=>{if(e.pointerId===joyId){joyActive=false;resetJoy();}});

renderer.domElement.addEventListener('pointercancel',()=>{camDrag=false;});
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();camDist=T.MathUtils.clamp(camDist+Math.sign(e.deltaY)*.8,4.2,15);},{passive:false});

// ===== KUNAI PROJECTILES =====
const kunaiProjectiles = [];
let _glowTex = null;
function getGlowTex(){
  if(_glowTex) return _glowTex;
  if(window.WeaponVFX_glowTex) { _glowTex = window.WeaponVFX_glowTex; return _glowTex; }
  const s=64,cv=document.createElement('canvas');cv.width=cv.height=s;
  const ctx=cv.getContext('2d');
  const g=ctx.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  g.addColorStop(0,'rgba(255,255,255,1)');
  g.addColorStop(0.4,'rgba(255,255,255,0.6)');
  g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,s,s);
  _glowTex = new T.CanvasTexture(cv);
  return _glowTex;
}

function throwKunaiProjectile(color){
  const camDir = new T.Vector3();
  camera.getWorldDirection(camDir);
  const startPos = new T.Vector3();
  player.userData.arms[1].getWorldPosition(startPos);
  startPos.addScaledVector(camDir, 0.6);
  startPos.y += 0.2;

  const kunaiGroup = new T.Group();
  const bladeMat = new T.MeshStandardMaterial({color:0x00ffcc,emissive:0x00ffaa,emissiveIntensity:2,metalness:1,roughness:0.1});
  const handleMat = new T.MeshStandardMaterial({color:0x0a1a1a,metalness:0.6,roughness:0.5});

  const bladeGeo = new T.ConeGeometry(0.08, 0.5, 4);
  bladeGeo.rotateX(Math.PI / 2);
  const blade = new T.Mesh(bladeGeo, bladeMat);
  blade.position.z = 0.25;
  kunaiGroup.add(blade);

  const handle = new T.Mesh(new T.CylinderGeometry(0.03, 0.03, 0.2, 6), handleMat);
  handle.rotation.x = Math.PI / 2;
  handle.position.z = -0.1;
  kunaiGroup.add(handle);

  const ring = new T.Mesh(new T.TorusGeometry(0.06, 0.01, 6, 12), bladeMat);
  ring.position.z = -0.22;
  kunaiGroup.add(ring);

  const light = new T.PointLight(0x00ffcc, 2, 4, 2);
  kunaiGroup.add(light);

  kunaiGroup.position.copy(startPos);
  const targetQuat = new T.Quaternion().setFromUnitVectors(
    new T.Vector3(0, 0, 1),
    camDir.clone().normalize()
  );
  kunaiGroup.quaternion.copy(targetQuat);
  scene.add(kunaiGroup);

  const speed = 45;
  kunaiProjectiles.push({
    mesh: kunaiGroup,
    velocity: camDir.clone().multiplyScalar(speed),
    life: 1.5,
    trail: []
  });
}

function updateKunaiProjectiles(dt){
  for(let i = kunaiProjectiles.length - 1; i >= 0; i--){
    const p = kunaiProjectiles[i];
    p.life -= dt;
    p.mesh.position.addScaledVector(p.velocity, dt);

    if(Math.random() < 0.7){
      const spark = new T.Sprite(new T.SpriteMaterial({
        map: getGlowTex(),
        color: 0x00ffcc,
        transparent: true,
        opacity: 0.9,
        blending: T.AdditiveBlending,
        depthWrite: false
      }));
      spark.scale.setScalar(0.4 + Math.random() * 0.3);
      spark.position.copy(p.mesh.position);
      scene.add(spark);
      p.trail.push({sprite: spark, life: 0.5, maxLife: 0.5});
    }

    for(let j = p.trail.length - 1; j >= 0; j--){
      const tr = p.trail[j];
      tr.life -= dt;
      if(tr.life <= 0){
        scene.remove(tr.sprite);
        tr.sprite.material.dispose();
        p.trail.splice(j, 1);
      } else {
        tr.sprite.material.opacity = 0.9 * (tr.life / tr.maxLife);
        tr.sprite.scale.multiplyScalar(0.96);
      }
    }

    if(p.life <= 0){
      for(const tr of p.trail){
        scene.remove(tr.sprite);
        tr.sprite.material.dispose();
      }
      scene.remove(p.mesh);
      p.mesh.traverse(o => {
        if(o.geometry) o.geometry.dispose();
        if(o.material) o.material.dispose();
      });
      kunaiProjectiles.splice(i, 1);
    }
  }
}

$('btnAttack').onclick=()=>{
  if(attackCd>0||!player)return;
  attackCd=600;$('btnAttack').classList.add('cooldown');
  setTimeout(()=>{attackCd=0;$('btnAttack').classList.remove('cooldown');},600);
  if(drawState < 0.5){
    drawState = 1;
    WeaponVFX.setDrawState(1, player, player.userData.arms[1]);
    toastMsg('⚔ Rút vũ khí!');
    playAttackAnimation();
    return;
  }
  playAttackAnimation();
  const ring=new T.Mesh(new T.TorusGeometry(1,.08,8,32),new T.MeshBasicMaterial({color:0xffaa44,transparent:true,opacity:.8,blending:T.AdditiveBlending}));
  ring.position.copy(player.position);ring.position.y+=1;ring.rotation.x=Math.PI/2;scene.add(ring);
  const start=performance.now();
  function tick(){const t=(performance.now()-start)/600;if(t>=1){scene.remove(ring);ring.geometry.dispose();ring.material.dispose();return;}ring.scale.setScalar(1+t*4);ring.material.opacity=.8*(1-t);requestAnimationFrame(tick);}

};

function updatePlayer(dt){
  if(!player)return;
  const forward=(keys['w']||keys['arrowup']?1:0)-(keys['s']||keys['arrowdown']?1:0)-joyVec.y;
  const strafe=(keys['d']||keys['arrowright']?1:0)-(keys['a']||keys['arrowleft']?1:0)+joyVec.x;
  let dx = -Math.sin(yaw) * forward + Math.cos(yaw) * strafe;
  let dz = -Math.cos(yaw) * forward - Math.sin(yaw) * strafe;
  const len=Math.hypot(dx,dz);
  if(len>1){dx/=len;dz/=len;}
  const moving=len>.08;
  const speed=moveSpeed*(runFast?1.55:1);
  if(moving){
    const oldX=player.position.x,oldZ=player.position.z;
    const newX=T.MathUtils.clamp(oldX+dx*dt*speed,-63,319);
    const newZ=T.MathUtils.clamp(oldZ+dz*dt*speed,-63,191);
    if(!pointBlocked(newX,oldZ,.55))player.position.x=newX;
    if(!pointBlocked(player.position.x,newZ,.55))player.position.z=newZ;
    player.rotation.y=Math.atan2(dx,dz);
  }
  const groundY=heightAt(player.position.x,player.position.z);
  if(flyEnabled){playerY=T.MathUtils.clamp(playerY+flyVertical*flySpeed*dt,0,flyHeight);player.position.y=groundY+playerY+.03;}
  else if(performance.now()<jumpUntil){const t=(jumpUntil-performance.now())/520;player.position.y=groundY+.03+Math.sin((1-t)*Math.PI)*1.05;}
  else{player.position.y=groundY+.03;}

  const parts=player.userData;

  if(attackAnimActive){
    attackAnimT += dt * 4.5;
    if(attackAnimT >= 1){
      attackAnimT = 0;
      attackAnimActive = false;
      parts.arms[1].rotation.x = 0;
      parts.arms[1].rotation.z = 0;
      parts.arms[1].rotation.y = 0;
    } else {
      const t = attackAnimT;
      if(t < 0.3){
        const p = t / 0.3;
        parts.arms[1].rotation.x = -1.8 * p;
        parts.arms[1].rotation.z = -0.5 * p;
      } else if(t < 0.7){
        const p = (t - 0.3) / 0.4;
        const swingAngle = -1.8 + 3.2 * p;
        parts.arms[1].rotation.x = swingAngle;
        parts.arms[1].rotation.z = -0.5 + 1.0 * p;
        player.rotation.y += attackSwingDir * 0.04 * p;
      } else {
        const p = (t - 0.7) / 0.3;
        parts.arms[1].rotation.x = (1 - p) * 1.4;
        parts.arms[1].rotation.z = (1 - p) * 0.5;
      }
    }
  } else {
    if(moving){
      parts.legs.forEach((l,i)=>l.rotation.x=Math.sin(elapsed*(runFast?13:9)+i*Math.PI)*.58);
      parts.arms.forEach((a,i)=>a.rotation.x=Math.sin(elapsed*(runFast?13:9)+i*Math.PI+Math.PI)*.38);
      parts.arms[1].rotation.z = 0;
      parts.arms[1].rotation.y = 0;
    } else if(dancing){
      parts.legs.forEach(l=>l.rotation.x=Math.sin(elapsed*5)*.3);
      parts.arms.forEach((a,i)=>a.rotation.x=Math.sin(elapsed*5+i*Math.PI)*.9);
      player.rotation.y+=dt*1.2;
    } else {
      parts.legs.forEach(l=>l.rotation.x=0);
      parts.arms.forEach((a,i)=>a.rotation.x=Math.sin(elapsed*1.5+i)*.05);
      parts.arms[1].rotation.z = 0;
      parts.arms[1].rotation.y = 0;
    }
  }

  const z=zoneAt(player.position.x,player.position.z);
  if(z&&z.i!==lastRegion){
    lastRegion=z.i;
    const p=WorldEngine.PALETTE[z.i];
    $('hudTitle').innerHTML=p.name+'<small>'+p.sub+'</small>';
    toastMsg('📍 '+p.name);
  }
}

function updateDecor(dt,t){
  if(!world||!world.decor)return;
  for(const d of world.decor){
    if(d.type==='petal'){
      const o=d.obj;
      o.position.x=d.baseX+Math.sin(t*.6+d.phase)*2.5+d.speedX*t*.5;
      o.position.z=d.baseZ+Math.cos(t*.5+d.phase)*2.5+d.speedZ*t*.5;
      o.position.y=d.baseY+Math.sin(t*.9+d.phase)*1.5;
      const ddx=o.position.x-d.baseX, ddz=o.position.z-d.baseZ;
      if(Math.abs(ddx)>4) d.speedX*=-.5;
      if(Math.abs(ddz)>4) d.speedZ*=-.5;
      o.rotation.y+=dt*d.spinSpeed;
      o.rotation.x+=dt*d.spinSpeed*.7;
    } else if(d.type==='pondRipple'){
      const o=d.obj;
      const s=1+Math.sin(t*1.6+d.phase)*0.25;
      o.scale.set(d.baseSX*s,d.baseSZ*s,1);
      o.material.opacity=0.35+Math.sin(t*1.6+d.phase)*0.2;
    } else if(d.type==='pondFish'){
      d.phase+=dt*d.speed;
      const x=d.cx+Math.cos(d.phase)*d.rx;
      const z=d.cz+Math.sin(d.phase)*d.rz;
      const y=d.baseY+Math.sin(t*3+d.phase)*.04;
      d.obj.position.set(x,y,z);
      const dx=-Math.sin(d.phase)*d.rx;
      const dz=Math.cos(d.phase)*d.rz;
      d.obj.rotation.y=Math.atan2(-dz,dx);
      d.obj.rotation.z=Math.sin(t*4+d.phase)*.1;
    } else if(d.type==='lantern'){
      if(d.light)d.light.intensity=1.1*(0.85+Math.sin(t*3+d.phase)*0.15);
    }
  }
}

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  elapsed+=dt;
  updatePlayer(dt);
  updateDayNight(dt);
  updateDecor(dt,elapsed);
  updateWeather(dt,elapsed);
  updateKunaiProjectiles(dt);
  updateCamera();
  if(player){
    if(drawTransition !== drawState){
      const step = (drawState - drawTransition) * Math.min(1, dt * 8);
      drawTransition += step;
      if(Math.abs(drawState - drawTransition) < 0.01) drawTransition = drawState;
    }
    WeaponVFX.update(elapsed,dt);
    sun.position.set(player.position.x-35,52,player.position.z+26);
    sun.target.position.copy(player.position);
    sun.target.updateMatrixWorld();
    moonLight.position.set(player.position.x+35,60,player.position.z-26);
    moonLight.target.position.copy(player.position);
    moonLight.target.updateMatrixWorld();
    moonSprite.position.set(player.position.x-150,180,player.position.z-160);
    stars.position.set(player.position.x,0,player.position.z);
    starMat.uniforms.time.value=elapsed;
  }
  renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

function boot(){
  $('loadStatus').textContent='Đang xây dựng 6 khu vực...';
  setTimeout(()=>{
    world=WorldEngine.build(scene);
    heightAt=WorldEngine.heightAt;
    zoneAt=WorldEngine.zoneAt;
    pointBlocked=WorldEngine.pointBlocked;
    player=buildPlayerMesh();
    player.position.set(0,heightAt(0,9)+.03,9);
    scene.add(player);
    WeaponVFX.init(scene);
    renderWeaponDock();
    WeaponVFX.setDrawState(0, player, player.userData.arms[1]);
    drawState = 0;
    drawTransition = 0;
    applyDayNight(0);
    renderWeatherUI();
    $('timeDay').classList.add('active');
    $('loadStatus').textContent='Đang đặt NPC...';
    setTimeout(()=>{
      MinecraftNPC.spawn(scene);
      $('loadStatus').textContent='Sẵn sàng!';
      setTimeout(()=>{
        $('loading').classList.add('hide');
        setTimeout(()=>$('loading').style.display='none',600);
        toastMsg('🌍 Chào mừng đến Astra World!');
        animate();
      },300);
    },300);
  },200);
}

if(document.readyState==='complete'||document.readyState==='interactive'){setTimeout(boot,100);}
else{window.addEventListener('DOMContentLoaded',()=>setTimeout(boot,100));}
