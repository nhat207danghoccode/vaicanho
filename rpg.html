<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Nhóm</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f6fa;
    --panel: #ffffff;
    --panel-2: #f0f2f7;
    --border: #e4e7ef;
    --text: #1a1d29;
    --muted: #7a8194;
    --accent: #4361ee;
    --mine: linear-gradient(135deg, #4361ee, #7c3aed);
    --shadow: 0 2px 12px rgba(20, 30, 60, .06);
  }
  body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .hidden { display: none !important; }

  /* ===== LOGIN ===== */
  #login { margin: auto; background: var(--panel); padding: 36px 32px; border-radius: 24px; width: 400px; text-align: center; box-shadow: 0 20px 60px rgba(20,30,60,.12); }
  #login .logo { font-size: 40px; margin-bottom: 8px; }
  #login h1 { font-size: 22px; margin-bottom: 6px; font-weight: 700; }
  #login p { color: var(--muted); margin-bottom: 22px; font-size: 13px; }
  #login input[type=text] { width: 100%; padding: 13px 16px; background: var(--panel-2); border: 1.5px solid transparent; border-radius: 12px; margin-bottom: 16px; font-size: 15px; color: var(--text); outline: none; transition: .2s; font-family: inherit; }
  #login input[type=text]:focus { border-color: var(--accent); background: #fff; }

  .av-section { margin-bottom: 18px; }
  .av-preview { width: 84px; height: 84px; border-radius: 50%; margin: 0 auto 12px; background: var(--panel-2); overflow: hidden; box-shadow: 0 4px 20px rgba(67,97,238,.25); }
  .av-preview img { width: 100%; height: 100%; object-fit: cover; }
  .av-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-bottom: 10px; max-height: 140px; overflow-y: auto; padding: 4px; }
  .av-grid img { width: 100%; aspect-ratio: 1; border-radius: 50%; cursor: pointer; background: var(--panel-2); transition: .15s; border: 2.5px solid transparent; }
  .av-grid img:hover { transform: scale(1.08); }
  .av-grid img.selected { border-color: var(--accent); }
  .av-actions { display: flex; gap: 8px; justify-content: center; }
  .av-actions button { padding: 8px 14px; font-size: 12px; border-radius: 10px; border: 1.5px solid var(--border); background: #fff; color: var(--text); cursor: pointer; font-family: inherit; font-weight: 500; transition: .15s; }
  .av-actions button:hover { border-color: var(--accent); color: var(--accent); }

  #joinBtn { width: 100%; padding: 14px; background: var(--mine); color: #fff; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; transition: .15s; box-shadow: 0 6px 20px rgba(67,97,238,.3); }
  #joinBtn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(67,97,238,.4); }

  /* ===== APP ===== */
  #app { display: flex; height: 100vh; }
  .sidebar { width: 290px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  .sidebar-header { padding: 18px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); }
  .me-avatar { width: 42px; height: 42px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: var(--panel-2); box-shadow: 0 2px 8px rgba(0,0,0,.08); }
  .me-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .me-info { flex: 1; min-width: 0; }
  .me-name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .me-status { font-size: 11px; color: #22c55e; display: flex; align-items: center; gap: 4px; margin-top: 2px; }
  .me-status::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: #22c55e; }
  .change-avatar { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; padding: 4px; border-radius: 8px; transition: .15s; }
  .change-avatar:hover { background: var(--panel-2); }

  .section-title { padding: 14px 18px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); font-weight: 600; }
  .member-list { flex: 1; overflow-y: auto; padding: 4px 10px 14px; }
  .member { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; transition: .15s; }
  .member:hover { background: var(--panel-2); }
  .member .m-avatar { width: 32px; height: 32px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: var(--panel-2); }
  .member .m-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .member .m-name { font-size: 13px; font-weight: 500; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .member .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 2px #fff; }

  /* ===== CHAT ===== */
  .chat { flex: 1; display: flex; flex-direction: column; background: var(--bg); }
  .chat-header { padding: 18px 26px; border-bottom: 1px solid var(--border); font-weight: 600; display: flex; align-items: center; gap: 10px; background: var(--panel); font-size: 15px; }
  .status-dot { width: 9px; height: 9px; border-radius: 50%; background: #f59e0b; box-shadow: 0 0 0 3px rgba(245,158,11,.15); }
  .status-dot.ok { background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.15); }
  .status-dot.err { background: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,.15); }

  /* Nút thoát */
  .exit-btn { display: flex; align-items: center; gap: 6px; padding: 8px 14px; background: var(--panel-2); border: 1.5px solid var(--border); border-radius: 10px; color: var(--text); font-size: 13px; font-weight: 600; font-family: inherit; cursor: pointer; transition: .15s; margin-right: 6px; }
  .exit-btn:hover { background: #fee2e2; border-color: #fca5a5; color: #dc2626; }

  .messages { flex: 1; overflow-y: auto; padding: 24px 26px; display: flex; flex-direction: column; gap: 14px; }
  .msg-row { display: flex; gap: 10px; align-items: flex-end; max-width: 72%; animation: fadeIn .2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .msg-row.mine { align-self: flex-end; flex-direction: row-reverse; }
  .msg-row .avatar { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; flex-shrink: 0; background: var(--panel-2); box-shadow: 0 2px 6px rgba(0,0,0,.08); }
  .msg-row .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .bubble-wrap { display: flex; flex-direction: column; }
  .msg-row.mine .bubble-wrap { align-items: flex-end; }
  .bubble-wrap .name { font-size: 11px; color: var(--muted); margin-bottom: 4px; padding: 0 6px; font-weight: 500; }
  .msg { padding: 11px 16px; border-radius: 18px; font-size: 14px; line-height: 1.45; word-wrap: break-word; }
  .msg.other { background: var(--panel); color: var(--text); border-bottom-left-radius: 5px; box-shadow: 0 2px 8px rgba(20,30,60,.06); }
  .msg.mine { background: var(--mine); color: #fff; border-bottom-right-radius: 5px; box-shadow: 0 4px 14px rgba(67,97,238,.3); }
  .msg.sticker { font-size: 46px; background: transparent !important; padding: 0; box-shadow: none !important; }
  .msg.system { align-self: center; background: rgba(67,97,238,.08); color: #4a5580; font-size: 12px; padding: 7px 16px; border-radius: 16px; font-weight: 500; }

  .input-area { display: flex; gap: 10px; padding: 16px 22px; border-top: 1px solid var(--border); align-items: center; position: relative; background: var(--panel); }
  .input-area input[type=text] { flex: 1; padding: 13px 20px; background: var(--panel-2); border: 1.5px solid transparent; border-radius: 24px; font-size: 14px; color: var(--text); outline: none; font-family: inherit; transition: .18s; }
  .input-area input[type=text]:focus { background: #fff; border-color: var(--accent); }
  .input-area button { padding: 12px 22px; border: none; border-radius: 24px; background: var(--mine); color: #fff; font-weight: 600; cursor: pointer; font-size: 14px; font-family: inherit; box-shadow: 0 4px 14px rgba(67,97,238,.3); transition: .15s; }
  .input-area button:hover { transform: translateY(-1px); }
  .sticker-btn { background: var(--panel-2) !important; color: var(--text) !important; font-size: 20px !important; padding: 10px 15px !important; box-shadow: none !important; }
  .sticker-picker { position: absolute; bottom: 78px; right: 22px; background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 12px; display: flex; gap: 6px; flex-wrap: wrap; width: 280px; box-shadow: 0 12px 40px rgba(20,30,60,.18); z-index: 10; }
  .sticker-picker span { font-size: 30px; cursor: pointer; padding: 4px; border-radius: 10px; transition: .12s; }
  .sticker-picker span:hover { background: var(--panel-2); transform: scale(1.15); }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #d6dae6; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #c2c7d6; }

  @media (max-width: 720px) {
    .sidebar { width: 72px; }
    .sidebar-header .me-info, .sidebar-header .change-avatar, .section-title, .member .m-name, .member .dot { display: none; }
    .member { justify-content: center; }
    .msg-row { max-width: 85%; }
    .exit-btn span { display: none; }
    .exit-btn { padding: 8px 10px; margin-right: 2px; }
  }
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="login">
  <div class="logo">💬</div>
  <h1>Chat Nhóm</h1>
  <p>Chọn avatar và nhập tên để bắt đầu</p>

  <div class="av-section">
    <div class="av-preview" id="avPreview"><img src="" alt=""></div>
    <div class="av-grid" id="avGrid"></div>
    <div class="av-actions">
      <button type="button" id="shuffleBtn">🎲 Đổi bộ khác</button>
      <button type="button" id="uploadBtn">📷 Ảnh của tao</button>
    </div>
    <input type="file" id="avatarFile" accept="image/*" class="hidden" />
  </div>

  <input id="nameInput" type="text" placeholder="Tên của mày..." maxlength="20" />
  <button type="button" id="joinBtn">Vào chat →</button>
</div>

<!-- ===== APP ===== -->
<div id="app" class="hidden">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="me-avatar" id="meAvatar"></div>
      <div class="me-info">
        <div class="me-name" id="meLabel"></div>
        <div class="me-status">Online</div>
      </div>
      <button type="button" class="change-avatar" id="changeAvatarBtn" title="Đổi avatar">⚙️</button>
    </div>

    <div class="section-title">Thành viên</div>
    <div class="member-list" id="memberList"></div>
  </div>

  <div class="chat">
    <div class="chat-header">
      <button type="button" class="exit-btn" id="exitBtn">← <span>Thoát</span></button>
      <span class="status-dot" id="statusDot"></span>
      <span id="chatHeader">Chat nhóm — đang kết nối...</span>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-area">
      <button type="button" class="sticker-btn" id="stickerBtn">😊</button>
      <div class="sticker-picker hidden" id="stickerPicker"></div>
      <input type="text" id="msgInput" placeholder="Nhập tin nhắn..." />
      <button type="button" id="sendBtn">Gửi</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDmCYQi3ue4kPYUhd3AXRF98NwEO7NtYww",
  authDomain: "anime-f57e6.firebaseapp.com",
  databaseURL: "https://anime-f57e6-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "anime-f57e6",
  storageBucket: "anime-f57e6.firebasestorage.app",
  messagingSenderId: "546284227871",
  appId: "1:546284227871:web:68e939a098af2211ad342a"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const ROOM = "nhom1";

const STICKERS = ["😀","😂","😍","😎","🤔","👍","👏","🔥","💯","🎉","😢","😡","🙏","🤝","💪","✅","❌","⭐"];
const AVATAR_STYLES = ["notionists", "adventurer", "fun-emoji", "bottts", "lorelei", "micah", "miniavs", "open-peeps"];
const AVATAR_COLORS = ["b6e3f4","c0aede","d1d4f9","ffd5dc","ffdfbf","c1f0dc","ffe0b2"];

let me = "";
let myAvatar = "";
let messages = [];
let members = {};
let currentStyle = AVATAR_STYLES[Math.floor(Math.random() * AVATAR_STYLES.length)];

function makeAvatarUrl(style, seed) {
  const color = AVATAR_COLORS[Math.floor(Math.random() * AVATAR_COLORS.length)];
  return `https://api.dicebear.com/7.x/${style}/svg?seed=${encodeURIComponent(seed)}&backgroundColor=${color}`;
}

function saveLocalAvatar(name, dataUrl) { try { localStorage.setItem("avatar_" + name, dataUrl); } catch(e) {} }

// ===== INIT =====
document.addEventListener("DOMContentLoaded", () => {
  buildAvatarGrid();

  document.getElementById("shuffleBtn").addEventListener("click", () => {
    currentStyle = AVATAR_STYLES[Math.floor(Math.random() * AVATAR_STYLES.length)];
    buildAvatarGrid();
  });
  document.getElementById("uploadBtn").addEventListener("click", () => document.getElementById("avatarFile").click());
  document.getElementById("avatarFile").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 800000) alert("Ảnh hơi to, nên chọn ảnh < 800KB cho nhẹ nhé");
    const reader = new FileReader();
    reader.onload = (ev) => {
      myAvatar = ev.target.result;
      document.getElementById("avPreview").innerHTML = `<img src="${myAvatar}">`;
      document.querySelectorAll(".av-grid img").forEach(i => i.classList.remove("selected"));
    };
    reader.readAsDataURL(file);
  });

  document.getElementById("joinBtn").addEventListener("click", join);
  document.getElementById("nameInput").addEventListener("keydown", (e) => { if (e.key === "Enter") join(); });

  document.getElementById("sendBtn").addEventListener("click", sendMsg);
  document.getElementById("stickerBtn").addEventListener("click", toggleStickers);
  document.getElementById("msgInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); sendMsg(); }
  });
  document.getElementById("changeAvatarBtn").addEventListener("click", changeAvatar);

  // ===== NÚT THOÁT =====
  document.getElementById("exitBtn").addEventListener("click", exitChat);
});

/* ============================================================
   EXIT CHAT — SỬA TẠI ĐÂY
   Ưu tiên đóng iframe #rpgGameShell trên trang cha (cùng origin),
   xóa src iframe để lần mở sau nạp lại sạch, cuộn trang cha về đầu.
   ============================================================ */
function exitChat() {
  // 1) Đánh dấu offline trước khi rời
  if (me) {
    db.ref(`rooms/${ROOM}/members/${me}`).update({ online: false, lastSeen: Date.now() }).catch(() => {});
  }

  // 2) Nếu đang nằm trong iframe
  if (window.parent && window.parent !== window) {
    try {
      // Báo cho trang cha (nếu có listener thì tốt)
      window.parent.postMessage({ type: "exit-chat" }, "*");
      window.parent.postMessage({ type: "RPG_CLOSE" }, "*");

      // Thao tác DOM trang cha (cùng origin)
      const parentDoc = window.parent.document;
      const shell = parentDoc.getElementById("rpgGameShell");
      if (shell) shell.classList.remove("on");

      const frame = parentDoc.getElementById("rpgGameFrame");
      if (frame) frame.removeAttribute("src");

      // Cuộn trang cha về đầu
      try { window.parent.scrollTo({ top: 0, behavior: "smooth" }); } catch (e) {}
    } catch (e) {
      // Khác origin (không xảy ra khi cùng server) — bỏ qua
      console.warn("Không thể thao tác DOM trang cha:", e);
    }
    return;
  }

  // 3) Mở trực tiếp (không trong iframe) → quay lại trang trước
  if (window.history.length > 1) {
    window.history.back();
  } else {
    window.close();
    window.location.href = "about:blank";
  }
}

function buildAvatarGrid() {
  const grid = document.getElementById("avGrid");
  grid.innerHTML = "";
  const seeds = ["Minh","Lan","Huy","Trang","Duc","Linh","An","Tu","Mai","Khoa","Vy","Nam"];
  seeds.forEach(seed => {
    const url = makeAvatarUrl(currentStyle, seed + Math.random().toString(36).slice(2,5));
    const img = document.createElement("img");
    img.src = url;
    img.dataset.url = url;
    img.addEventListener("click", () => {
      document.querySelectorAll(".av-grid img").forEach(i => i.classList.remove("selected"));
      img.classList.add("selected");
      myAvatar = url;
      document.getElementById("avPreview").innerHTML = `<img src="${url}">`;
    });
    grid.appendChild(img);
  });
  grid.firstChild?.click();
}

// ===== JOIN =====
async function join() {
  const name = document.getElementById("nameInput").value.trim();
  if (!name) return alert("Nhập tên đi mày!");
  if (!myAvatar) myAvatar = makeAvatarUrl(currentStyle, name);

  me = name;
  saveLocalAvatar(me, myAvatar);

  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("meLabel").textContent = me;
  document.getElementById("meAvatar").innerHTML = `<img src="${myAvatar}">`;

  const memberRef = db.ref(`rooms/${ROOM}/members/${me}`);
  await memberRef.set({ avatar: myAvatar, online: true, lastSeen: Date.now() });
  memberRef.onDisconnect().update({ online: false, lastSeen: Date.now() });

  db.ref(`rooms/${ROOM}/members`).on('value', (s) => { members = s.val() || {}; renderMembers(); renderMessages(); });
  db.ref(`rooms/${ROOM}/messages`).limitToLast(200).on('child_added', (s) => {
    messages.push(s.val());
    renderMessages();
  });

  db.ref(".info/connected").on("value", (s) => {
    const ok = s.val() === true;
    const dot = document.getElementById("statusDot");
    dot.className = "status-dot " + (ok ? "ok" : "err");
    document.getElementById("chatHeader").textContent = ok ? "Chat nhóm — đã kết nối" : "Chat nhóm — mất kết nối";
  });

  buildStickerPicker();
  document.getElementById("msgInput").focus();
}

async function changeAvatar() {
  const url = prompt("Dán URL ảnh avatar mới (để trống = random đẹp):");
  if (url === null) return;
  myAvatar = url.trim() || makeAvatarUrl(AVATAR_STYLES[Math.floor(Math.random()*AVATAR_STYLES.length)], me + Date.now());
  saveLocalAvatar(me, myAvatar);
  document.getElementById("meAvatar").innerHTML = `<img src="${myAvatar}">`;
  await db.ref(`rooms/${ROOM}/members/${me}`).update({ avatar: myAvatar });
}

// ===== RENDER MEMBERS =====
function renderMembers() {
  const box = document.getElementById("memberList");
  box.innerHTML = "";
  Object.entries(members).forEach(([name, data]) => {
    const div = document.createElement("div");
    div.className = "member";
    div.innerHTML = `
      <div class="m-avatar">${data.avatar ? `<img src="${data.avatar}">` : "🙂"}</div>
      <span class="m-name">${escapeHtml(name)}${name === me ? " (mày)" : ""}</span>
      ${data.online ? '<span class="dot"></span>' : ''}
    `;
    box.appendChild(div);
  });
}

// ===== CHAT =====
function sendMsg() {
  const input = document.getElementById("msgInput");
  const text = input.value.trim();
  if (!text) return;
  pushMessage({ type: 'text', from: me, text, time: Date.now() });
  input.value = ""; input.focus();
}
function sendSticker(s) {
  pushMessage({ type: 'sticker', from: me, text: s, time: Date.now() });
  document.getElementById("stickerPicker").classList.add("hidden");
}
function pushMessage(msg) { db.ref(`rooms/${ROOM}/messages`).push(msg); }

function renderMessages() {
  const box = document.getElementById("messages");
  box.innerHTML = "";
  messages.forEach(m => {
    if (m.type === 'system') {
      const d = document.createElement("div");
      d.className = "msg system"; d.textContent = m.text;
      box.appendChild(d); return;
    }
    const isMine = m.from === me;
    const av = members[m.from]?.avatar || makeAvatarUrl("notionists", m.from);

    const row = document.createElement("div");
    row.className = "msg-row" + (isMine ? " mine" : "");

    const avatarDiv = document.createElement("div");
    avatarDiv.className = "avatar";
    avatarDiv.innerHTML = `<img src="${av}">`;

    const bw = document.createElement("div");
    bw.className = "bubble-wrap";
    if (!isMine) {
      const n = document.createElement("div");
      n.className = "name"; n.textContent = m.from;
      bw.appendChild(n);
    }
    const bubble = document.createElement("div");
    if (m.type === 'sticker') { bubble.className = "msg sticker"; bubble.textContent = m.text; }
    else { bubble.className = "msg " + (isMine ? "mine" : "other"); bubble.innerHTML = escapeHtml(m.text); }
    bw.appendChild(bubble);

    row.appendChild(avatarDiv); row.appendChild(bw);
    box.appendChild(row);
  });
  box.scrollTop = box.scrollHeight;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function toggleStickers() { document.getElementById("stickerPicker").classList.toggle("hidden"); }
function buildStickerPicker() {
  const p = document.getElementById("stickerPicker");
  p.innerHTML = "";
  STICKERS.forEach(s => {
    const span = document.createElement("span");
    span.textContent = s;
    span.addEventListener("click", () => sendSticker(s));
    p.appendChild(span);
  });
}
</script>
</body>
</html>
